<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Publications · Xin Di</title>
<meta name="description" content="Publications by Xin Di: articles, reviews, preprints and conference abstracts on brain connectivity and fMRI.">
<link rel="stylesheet" href="style.css"></head>
<body><main id="main" class="wrap">
<h1>Publications</h1>
<p>Also on <a href="https://scholar.google.com/citations?user=wDjD46gAAAAJ&amp;hl=en">Google Scholar</a>. Author lists marked “et al.” are abbreviated.</p>
<div class="controls">
  <input id="q" type="search" placeholder="Search title, author, journal, year…" aria-label="Search publications">
  <div class="chips" id="chips"></div>
</div>
<p class="count" id="count" aria-live="polite"></p>
<div id="list"></div>
</main>
<script src="pubs.js"></script>
<script src="site.js"></script>
<script>
(function(){
  var TYPES=[["all","All"],["article","Articles"],["preprint","Preprints"],["review","Reviews"],["chinese","Chinese"],["drawer","File drawer"],["abstract","Abstracts"]];
  var type="all", q="";
  var list=document.getElementById("list"), count=document.getElementById("count"), chips=document.getElementById("chips");
  function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function hl(s){
    s=esc(s);
    if(q){ var r=new RegExp("("+esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"); s=s.replace(r,"<mark>$1</mark>"); }
    return s;
  }
  function authors(a){ return hl(a).replace(/Di X/g,"<b>Di X</b>"); }
  chips.innerHTML=TYPES.map(function(t){return '<button class="chip" data-t="'+t[0]+'" aria-pressed="'+(t[0]==="all")+'">'+t[1]+'</button>'}).join("");
  function setActive(t){[].forEach.call(chips.children,function(c){c.setAttribute("aria-pressed",String(c.dataset.t===t))})}
  chips.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return; type=b.dataset.t;
    setActive(type); render(); history.replaceState(null,"","#"+type);
  });
  document.getElementById("q").addEventListener("input",function(e){q=e.target.value.trim();render()});
  function render(){
    var rows=PUBS.filter(function(p){
      if(type!=="all"&&p[1]!==type) return false;
      return !q||(p.slice(0,5).join(" ").toLowerCase().indexOf(q.toLowerCase())>-1);
    }).sort(function(a,b){return b[0]-a[0]});
    count.textContent=rows.length+" item"+(rows.length===1?"":"s");
    var out="",y=null;
    rows.forEach(function(p){
      if(p[0]!==y){y=p[0];out+='<h2 class="year">'+y+'</h2>'}
      var t=hl(p[3]); if(p[5]) t='<a href="'+p[5]+'" target="_blank" rel="noopener">'+t+'</a>';
      out+='<div class="pub"><div class="t">'+t+'</div><div class="a">'+authors(p[2])+'</div><div class="j"><em>'+hl(p[4])+'</em></div></div>';
    });
    list.innerHTML=out||'<p>No matches.</p>';
  }
  var h=location.hash.slice(1);
  if(TYPES.some(function(t){return t[0]===h})){type=h;setActive(h)}
  render();
})();
</script></body></html>
